[pytest]
addopts = --alluredir=allure-results --strict-markers
pythonpath = .
markers =
   smoke: mark test as smoke
   login: mark test as login
   logout: mark test as logout
   view_users: mark test as view users
   admin: mark test as testadmin
   new_user: mark test as create new user
   duplicate: mark test as duplicate user
   required: mark test as required
   search_by_username: mark test as search by username
   search_by_role: mark test as search by role
   search_nonexistent: mark test as search for non-existent user
   edit_user: mark test as edit user
   delete_user: mark test as delete user
   bulk_delete_users: mark test as bulk delete users
   pim: mark test as pim
   view_employees: mark test as view employees
   new_employee: mark test as create new employee
   without_name: mark test as create employee without name
   search_by_name: mark test as search by name
   search_by_id: mark test as search by id
   search_no_results: mark test as search for no results
   view_profile: mark test as view profile
   update_profile: mark test as update profile
   delete_employee: mark test as delete employee

[allure]
results_dir = allure-results